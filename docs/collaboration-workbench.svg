<rect x="44" y="142" width="820" height="326" rx="8" fill="#fbfbfd" stroke="#e5e7eb"/>
<rect x="190" y="214" width="160" height="104" rx="7" fill="#f6d365" stroke="#d6b656"/><text x="270" y="270" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" text-anchor="middle">一个想法</text>
<rect x="430" y="190" width="170" height="102" rx="52" fill="#b8e0d2" stroke="#8bbfae"/><text x="515" y="247" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" text-anchor="middle">AI 补充</text>
<rect x="310" y="350" width="300" height="42" rx="7" fill="#ffffff" stroke="#d8dee8"/><text x="460" y="376" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" text-anchor="middle">少一点界面，多一点画布</text>
<path d="M 350 266 L 430 245" stroke="#64748b" stroke-width="3" fill="none"/>
<rect x="884" y="142" width="272" height="326" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="904" y="174" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" text-anchor="start">和 AI 说</text>
