<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">简单画板交互方向</title>
<desc id="desc">默认界面只有顶栏、工具栏、无限画布和轻量交流区；项目工作台是次级入口。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="520" fill="#f8fafc"/>
<rect x="28" y="28" width="1144" height="464" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<rect x="28" y="28" width="1144" height="48" rx="14" fill="#ffffff"/>
<text x="52" y="58" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" text-anchor="start">AI 画板</text>
<text x="1144" y="58" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="end">项目工作台</text>
<rect x="28" y="76" width="1144" height="1" fill="#e5e7eb"/>
