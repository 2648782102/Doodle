<rect x="222" y="92" width="70" height="34" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/><text x="257" y="114" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">文字</text>
<rect x="300" y="92" width="70" height="34" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/><text x="335" y="114" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">形状</text>
