<rect x="904" y="260" width="232" height="54" rx="7" fill="#f8fafc" stroke="#e5e7eb"/><text x="920" y="284" fill="#5b4bc4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">AI · 好的，我补在画布上</text><text x="920" y="304" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="400" text-anchor="start">同一份 BOARD_JSON</text>
<rect x="904" y="410" width="232" height="38" rx="7" fill="#eff6ff" stroke="#93c5fd"/><text x="1020" y="434" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">放到画板</text>
<text x="600" y="503" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="middle">默认界面不展示扫描、源码证据、流程图仪表盘或提案卡片</text>
</svg>