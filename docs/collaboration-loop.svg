<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">AI Draw MCP 简单共享无限画板</title>
<desc id="desc">人和 AI 在同一张无限画布上画便签、文字、形状和线条，并在旁边写短留言；项目工作台只是可选能力。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="1200" height="420" fill="#f8fafc"/>
<text x="600" y="54" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700" text-anchor="middle">AI Draw MCP · 简单共享无限画板</text>
<text x="600" y="84" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">人画 · AI 读 · AI 画 · 人继续画</text>
<rect x="70" y="145" width="220" height="110" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/><text x="180" y="183" fill="#0f766e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="600" text-anchor="middle">人</text><text x="180" y="214" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">点一下就画</text><text x="180" y="237" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">拖一下就改</text>
<rect x="490" y="120" width="220" height="160" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="600" y="164" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="600" text-anchor="middle">无限画布</text><text x="600" y="196" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="middle">便签 · 文字 · 形状 · 线条</text><text x="600" y="222" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="middle">人和 AI 的同一份上下文</text><text x="600" y="252" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="middle">短留言放在画布旁</text>
<rect x="910" y="145" width="220" height="110" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/><text x="1020" y="183" fill="#5b4bc4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="600" text-anchor="middle">AI</text><text x="1020" y="214" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">get_board</text><text x="1020" y="237" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">draw_board</text>
<path d="M 290 200 C 345 200, 435 200, 490 200" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 200 C 765 200, 855 200, 910 200" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 910 235 C 965 235, 655 260, 710 260" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 490 235 C 545 235, 235 260, 290 260" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="335" width="360" height="48" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/><text x="600" y="365" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="middle">项目扫描 / diff / 批准 → /workbench（可选）</text>
</svg>