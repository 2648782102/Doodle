[mcp_servers.doodle]
command = "node"
args = ["<absolute-path-to>/Doodle/dist/index.js"]
cwd = "<absolute-path-to-your-project>"

[mcp_servers.doodle.env]
DOODLE_WORKSPACE_ROOT = "<absolute-path-to-your-project>"
OUTPUT_DIR = "<absolute-path-to>/Doodle/output"
PREVIEW_HOST = "127.0.0.1"
PREVIEW_PORT = "3399"
LOG_LEVEL = "info"
