name: Publish Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish; defaults to the current package version
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Write release notes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const start = changelog.indexOf(`## ${version} —`);
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const next = changelog.indexOf("\n## ", start + 1);
          const section = (next < 0 ? changelog.slice(start) : changelog.slice(start, next)).trim();
          fs.writeFileSync("release-notes.md", `${section}\n`);
          NODE
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${REQUESTED_TAG:-v$version}"
          asset="doodle-$version.zip"
          asset_path="doodle-plugin-submission/$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; checking whether its ZIP is current"
            remote_sha=$(gh release view "$tag" --json assets \
              --jq ".assets[] | select(.name == \"$asset\") | .digest" || true)
            local_sha="sha256:$(sha256sum "$asset_path" | cut -d' ' -f1)"
            if [ "$remote_sha" = "$local_sha" ]; then
              echo "Release asset is already current"
              exit 0
            fi
            echo "Release asset is stale or missing; replacing it from this commit"
            gh release upload "$tag" "$asset_path#$asset" --clobber
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "$tag — Doodle Shared Board plugin" \
            --notes-file release-notes.md \
            "$asset_path#$asset"
