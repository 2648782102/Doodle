name: CI

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify final-state board context projection
        run: |
          node --input-type=module <<'NODE'
          import { buildBoardModelContext } from "./dist/board/app-context.js";
          const board = {
            version: 1,
            id: "ci",
            title: "CI",
            revision: 1,
            updatedAt: new Date(0).toISOString(),
            items: [],
          };
          const context = buildBoardModelContext(board);
          if (context.structuredContent.type !== "doodle_board_context" || context.structuredContent.board.revision !== 1) {
            process.exit(1);
          }
          NODE
      - run: npm run test:examples
      - run: npm run repo:check
      - run: npm run repo:plugin-check
      - run: npm run setup:codex -- --dry-run
      - run: npm run build:submission
      - run: npm run doctor
      - run: npm pack --dry-run
