name: CI

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify final-state board context projection
        run: |
          node --input-type=module <<'NODE'
          import { buildBoardModelContext } from "./dist/board/app-context.js";
          const board = {
            version: 1,
            id: "ci",
            title: "CI",
            revision: 1,
            updatedAt: new Date(0).toISOString(),
            items: [],
          };
          const context = buildBoardModelContext(board);
          if (context.structuredContent.type !== "doodle_board_context" || context.structuredContent.board.revision !== 1) {
            process.exit(1);
          }
          NODE
      - name: Verify local board library snapshots
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { BoardLibrary } from "./dist/board/library.js";
          import { createEmptyBoard, touchBoard } from "./dist/board/types.js";
          const outputDir = await fs.mkdtemp(path.join(os.tmpdir(), "doodle-ci-library-"));
          try {
            const library = new BoardLibrary(outputDir);
            const current = touchBoard(createEmptyBoard());
            const seeded = await library.apply({ type: "list" }, current);
            const created = await library.apply({ type: "create", name: "CI board", switchTo: true }, seeded.board);
            if (created.index.boards.length !== 2 || created.index.activeId === seeded.index.activeId) process.exit(1);
            const switched = await library.apply({ type: "switch", id: seeded.index.activeId }, created.board);
            if (switched.index.activeId !== seeded.index.activeId) process.exit(1);
          } finally {
            await fs.rm(outputDir, { recursive: true, force: true });
          }
          NODE
      - name: Verify AI visual language
        run: |
          node --input-type=module <<'NODE'
          import { createEmptyBoard, addBoardItems, boardVisualDigest } from "./dist/board/types.js";
          import { buildBoardModelContext } from "./dist/board/app-context.js";
          const board = addBoardItems(createEmptyBoard(), [
            { type: "rect", x: 0, y: 0, w: 120, h: 80, text: "A", role: "step", author: "ai" },
            { type: "rect", x: 200, y: 0, w: 120, h: 80, text: "B", role: "step", author: "ai" },
          ]);
          const line = addBoardItems(board, [{ type: "line", x: 120, y: 40, w: 80, h: 0, text: "next", startItemId: board.items[0].id, endItemId: board.items[1].id, author: "ai" }]);
          const digest = boardVisualDigest(line);
          const context = buildBoardModelContext({ ...line, itemCount: line.items.length });
          if (digest.connections[0].label !== "next" || !context.content[0].text.includes("→")) process.exit(1);
          NODE
      - name: Verify Excalidraw adapter
        run: |
          node --input-type=module <<'NODE'
          import { boardItemsToExcalidrawSkeleton, excalidrawElementsToBoardItems } from "./dist/board/excalidraw-adapter.js";
          const skeletons = boardItemsToExcalidrawSkeleton([{ id: "a", type: "rect", x: 0, y: 0, w: 100, h: 60, text: "A", color: "#f6d365", author: "ai", createdAt: new Date(0).toISOString(), updatedAt: new Date(0).toISOString() }]);
          const items = excalidrawElementsToBoardItems([{ id: "a", type: "rectangle", x: 0, y: 0, width: 100, height: 60, backgroundColor: "#f6d365", customData: { doodle: { author: "ai" } } }]);
          if (skeletons[0].id !== "a" || items[0].text !== "") process.exit(1);
          NODE
      - run: npm run test:examples
      - run: npm run repo:check
      - run: npm run repo:plugin-check
      - run: npm run setup:codex -- --dry-run
      - run: npm run build:submission
      - run: npm run doctor
      - run: npm pack --dry-run
