name: Bug report
description: Report a reproducible board or MCP problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行 `npm run doctor`，并贴出不含敏感信息的输出。
        如果问题涉及画板状态，请说明 `revision`、对象 ID 和复现步骤；不需要提交 `output/.doodle/board.json` 中的私人内容。
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did the human or AI do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: stderr logs, browser console, and doctor output
      render: shell
