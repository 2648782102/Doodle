name: Feature request
description: Suggest a small capability for the shared board
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult for the human or AI today?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Proposed experience
      description: Keep the canvas simple; describe both the MCP and human sides.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary
      description: Does this add a tool, persist state, open windows, expose workspace paths, or write project files?
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Which tests and offline checks should prove the change?
