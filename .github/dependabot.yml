version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node must track the minimum supported runtime (engines: >=20),
      # not the newest Node. Types ahead of the runtime let code compile
      # against APIs that do not exist on Node 20; CI would only catch that
      # when the affected path happens to be exercised. Raise this only
      # together with engines and the CI matrix.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Excalidraw 0.18 renders the human canvas and depends on React 18, so
      # react, react-dom and their types are pinned to 18.3.1 on purpose.
      # Lifting this needs an Excalidraw version that supports React 19.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
