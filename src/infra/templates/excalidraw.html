<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle · Excalidraw Canvas</title>
  <style>
    html, body, #excalidrawRoot { height: 100%; margin: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .excalidraw-host { height: 100%; }
    .excalidraw .App-menu_top { z-index: 4; }
    #toast { position: fixed; left: 50%; bottom: 18px; z-index: 20; transform: translateX(-50%); padding: 7px 12px; border-radius: 6px; color: #fff; background: #334155; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    #toast.visible { opacity: 1; }
    .engine-badge { position: fixed; right: 12px; bottom: 12px; z-index: 20; padding: 5px 9px; border: 1px solid #d9dde4; border-radius: 999px; background: rgba(255,255,255,.94); color: #6b7280; font-size: 11px; }
  </style>
  <link rel="stylesheet" href="/excalidraw/index.css">
</head>
<body>
  <div id="excalidrawRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="engine-badge">Excalidraw engine · 实验画布</div>
  <script>const PANEL_TOKEN = "__DOODLE_PANEL_TOKEN__"; window.DOODLE_EXCALIDRAW_TOKEN = PANEL_TOKEN;</script>
  <script type="module" src="/excalidraw/excalidraw-app.js"></script>
</body>
</html>
