<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle · Excalidraw Canvas</title>
  <link rel="stylesheet" href="/excalidraw/index.css">
  <style>
    /*
     * Handwriting faces for the sketch theme.
     *
     * Both files already ship inside the Excalidraw bundle — no asset is added
     * and nothing is fetched from a CDN. Declaring them here, rather than
     * relying on Excalidraw's lazy registration, is what makes the faces
     * available to *chrome* text: Excalidraw only injects a `@font-face` once a
     * canvas element asks for that family, so without this the theme's headings
     * would paint in the fallback.
     *
     * `Virgil` covers Latin; `Xiaolai` covers Chinese and is shipped as many
     * unicode-range shards. Declaring a single `@font-face` with `local()` and a
     * `src` list lets the browser pick the shard it needs.
     */
    @font-face {
      font-family: "Doodle Sketch";
      src: url("/excalidraw/fonts/Virgil/Virgil-Regular.woff2") format("woff2");
      font-display: swap;
      font-weight: 400;
    }
    /*
     * Glass must not leak into children.
     *
     * `liquid-glass.ts` sets `--glass-refraction` inline on each pane and marks
     * it `data-glass`. Custom properties inherit by default, so without this
     * reset every icon, 13px radio input, and 1×1 visually-hidden anchor inside
     * a pane inherits the *parent's* filter and runs a backdrop sample shaped
     * for the parent's bevel. A 40px button inside a 44px pill painted a
     * rounded tray belonging to neither element.
     *
     * `@property ... inherits: false` would be cleaner, but it only accepts
     * typed syntaxes and a `<url>` filter list has no type that also permits
     * the `blur(...)` fallback. Resetting inside each pane is equivalent here:
     * a nested element that is itself a pane carries its own `data-glass` and
     * its inline value wins by specificity.
     */
    [data-glass] * {
      --glass-refraction: none;
    }
    :root {
      color-scheme: light;
      --doodle-surface: rgba(253, 254, 250, 0.92);
      --doodle-surface-solid: #fbfcf7;
      --doodle-panel: rgba(250, 252, 246, 0.97);
      --doodle-ink: #1e2a26;
      --doodle-muted: #5f6e66;
      --doodle-border: rgba(30, 42, 38, 0.12);
      --doodle-border-strong: rgba(30, 42, 38, 0.22);
      --doodle-accent: #2f6b5c;
      --doodle-accent-soft: rgba(47, 107, 92, 0.1);
      --doodle-accent-ink: #ffffff;
      --doodle-danger: #b4463d;
      --doodle-canvas-bg: #f5f6f0;
      --doodle-dot: rgba(47, 107, 92, 0.22);
      /*
       * Low-frequency colour field under the dot grid.
       *
       * Glass is only legible when it has something to bend, and a near-white
       * canvas gives the bevel nothing. These washes sit at the page edges and
       * stay under ~15% saturation, so they give the lens a real gradient
       * without tinting the drawing area or competing with ink.
       */
      --doodle-wash-a: rgba(232, 178, 60, 0.34);
      --doodle-wash-b: rgba(96, 172, 150, 0.3);
      --doodle-wash-c: rgba(120, 170, 205, 0.22);
      --doodle-shadow: 0 16px 40px rgba(24, 40, 34, 0.12);
      --doodle-radius: 12px;
      --doodle-radius-sm: 8px;
      --doodle-space: 8px;
      --doodle-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --doodle-duration: 220ms;
      --doodle-drawer-width: 336px;
      --doodle-font: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

      /*
       * Liquid glass.
       *
       * The fill has to stay very low: at 0.30 white the pane measured as a
       * white card no matter what the refraction did, because the fill alone
       * covers the lensed backdrop. A pane is built from four separate parts,
       * the way Apple builds it:
       *
       *   fill      ~10% tint, only enough to lift the backdrop a little
       *   rim       a white hairline plus an inset glow, the glass thickness
       *   lens      the SVG displacement filter in `liquid-glass.ts`
       *   shadow    a wide, low-opacity drop shadow so it floats
       *
       * `--glass-blur`/`--glass-saturate` are the fallback for engines without
       * an SVG backdrop filter, not the main effect.
       */
      --glass-blur: 12px;
      --glass-saturate: 165%;
      /*
       * Almost no fill. The dot grid behind has to stay readable through the
       * pane, so the fill only lifts the surface a few percent; the bevel
       * filter and the rim do the rest. Tinting more made the pane read as a
       * grey card and washed out the lensing.
       */
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-bg-strong: rgba(255, 255, 252, 0.86);
      --glass-edge: rgba(255, 255, 255, 1);
      --glass-edge-outer: rgba(255, 255, 255, 0.62);
      --glass-highlight: rgba(255, 255, 255, 0.8);
      --glass-depth: rgba(16, 30, 24, 0.18);
      --glass-shade: rgba(16, 30, 24, 0.42);
      --glass-lens-scale: 0.9;
      --glass-lens-blur: 0.05;
      /* Centre frost radius: how soft the flat middle of the pane is. */
      --glass-frost: 0.42;
      --glass-tint: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 1px 2px rgba(24, 40, 34, 0.08), 0 12px 30px -8px rgba(24, 40, 34, 0.22);
      --glass-shadow-raised: 0 1px 2px rgba(24, 40, 34, 0.1), 0 20px 48px -10px rgba(24, 40, 34, 0.28);
      /*
       * Interaction inside the glass, not on top of it.
       *
       * A tool button must not paint an opaque chip over the pane: that reads
       * as a sticker and kills the lens. Hover instead *thickens* the glass —
       * a low-alpha wash plus an inner rim that follows the button's own
       * radius — so the control looks like a raised lens in the same material.
       * Values stay low enough that the dot grid behind still shows through.
       */
      --glass-hover-fill: rgba(255, 255, 255, 0.2);
      --glass-hover-rim: rgba(255, 255, 255, 0.92);
      --glass-hover-shade: rgba(16, 30, 24, 0.07);
      --glass-active-fill: rgba(255, 255, 255, 0.3);
      --glass-selected-fill: rgba(47, 107, 92, 0.12);
      --glass-selected-hover-fill: rgba(47, 107, 92, 0.18);
      --glass-selected-rim: rgba(47, 107, 92, 0.36);
      --glass-input-fill: rgba(255, 255, 255, 0.58);
      /*
       * How much of the Excalidraw surface colour each kind of pane carries.
       * These replace the 16/34/42% literals that used to be inline: a pane
       * that floats over the board must stay near-transparent so the lens is
       * visible, while a pane that holds controls needs enough body to keep
       * its labels legible. Doodle's own `.doodle-glass` fill is ~5.5%, and
       * these are expressed as mixes of the *same* surface colour so the two
       * families read as one material instead of glass next to white cards.
       */
    }
    /*
     * Hand-drawn sketch theme.
     *
     * This is a different material, not the light theme in warmer colours.
     * Light and dark are the same design at two luminances — calm glass on warm
     * paper. Sketch is a page from a field notebook: uncoated paper stock, a
     * graphite line rather than black ink, and a single muted blue-grey accent
     * that reads like a pencil annotation rather than a brand colour.
     *
     * Three rules keep it from becoming a costume:
     *
     *   - no texture images: the "paper" is a near-neutral ground plus the
     *     existing dot grid, so it stays crisp at any DPR and costs nothing;
     *   - no torn edges or rotations: chrome keeps its rounded geometry, only
     *     the type and the ink change;
     *   - the handwriting face is scoped to headings, never to dense UI.
     */
    :root[data-doodle-theme="sketch"] {
      color-scheme: light;
      --doodle-surface: rgba(252, 250, 244, 0.94);
      --doodle-surface-solid: #faf7f0;
      --doodle-panel: rgba(250, 247, 240, 0.98);
      /* Graphite, not black: pure #000 on paper reads as a printed screen. */
      --doodle-ink: #3a3733;
      --doodle-muted: #6f6961;
      --doodle-border: rgba(58, 55, 51, 0.16);
      --doodle-border-strong: rgba(58, 55, 51, 0.3);
      /* Pencil annotation blue, muted enough to sit next to graphite. */
      --doodle-accent: #4a6785;
      --doodle-accent-soft: rgba(74, 103, 133, 0.12);
      --doodle-accent-ink: #fdfbf6;
      --doodle-danger: #a4483c;
      /* Uncoated stock: warm cream, a touch deeper than the light theme so
         graphite ink has something to sit on without the page looking dusty. */
      --doodle-canvas-bg: #f8f4ea;
      --doodle-dot: rgba(58, 55, 51, 0.2);
      /*
       * Softer washes than the glass themes. Paper does not carry a colour
       * field; these stay warm and very low so the page reads as stock rather
       * than as a gradient.
       */
      --doodle-wash-a: rgba(206, 176, 120, 0.16);
      --doodle-wash-b: rgba(150, 160, 140, 0.13);
      --doodle-wash-c: rgba(152, 168, 186, 0.12);
      --doodle-shadow: 0 14px 34px rgba(58, 55, 51, 0.13);

      /*
       * Paper and ink instead of glass.
       *
       * This theme is not the light theme with warmer numbers: the *material*
       * changes. A lens bends what is behind it, which is the whole point of
       * the other two appearances and exactly wrong for paper — you cannot read
       * through a card. So the pane becomes an opaque sheet with a physical
       * edge: a warm top bevel catching light, a darker bottom lip for
       * thickness, and a tight shadow that reads as contact with the page
       * rather than a wide glass float.
       *
       * `--glass-lens-scale: 0` is the switch that turns refraction off.
       * `liquid-glass.ts` still writes a filter, but a zero-amplitude
       * displacement map is the identity map, so panes keep the blur/saturate
       * fallback only where the theme wants it. That keeps one code path
       * instead of a second rendering engine for one theme.
       */
      /*
       * Paper stock.
       *
       * Two values per role: the sheet colour and the shadow it throws onto the
       * desk. Everything else is derived, so adjusting the stock is a two-line
       * change rather than a hunt through twelve box-shadows.
       *
       * The tone is a warm off-white with a slight yellow bias — pure white
       * reads as a screen, and a stronger cream reads as parchment. This sits
       * between them, which is what uncoated card stock actually looks like
       * under office light.
       */
      --paper-sheet: #fdfbf5;
      --paper-sheet-warm: #faf6ec;
      --paper-sheet-edge: #f2ebdb;
      --paper-lip: #e4d9c1;
      --paper-crease: rgba(120, 104, 76, 0.14);
      --paper-bevel-light: rgba(255, 255, 255, 0.9);
      /*
       * One light source, at 45° from the upper left.
       *
       * Physical materials are only convincing when every edge agrees on where
       * the light is. These two are used by the pane bevel, the button wells,
       * and the raised states, so a card and a button on it are lit the same
       * way.
       */
      --paper-light-x: -1;
      --paper-light-y: -1;
      --paper-shade: rgba(120, 104, 76, 0.1);
      --paper-shade-deep: rgba(120, 104, 76, 0.2);
      /*
       * Layer heights.
       *
       * Sketch is a physical desk, so surfaces sit at three depths instead of
       * all floating at one. `flat` is the canvas itself; `card` is the toolbar
       * resting on the desk; `lifted` is a drawer or menu held above it. The
       * numbers differ in offset, blur, and opacity together — a deeper layer
       * is further away, so its shadow is both longer and softer.
       */
      --paper-shadow-card:
        0 1px 0 0 var(--paper-lip),
        0 1px 2px var(--paper-shade),
        0 4px 8px -3px var(--paper-shade);
      --paper-shadow-lifted:
        0 1px 0 0 var(--paper-lip),
        0 2px 4px var(--paper-shade),
        0 10px 20px -6px var(--paper-shade-deep),
        0 22px 40px -18px var(--paper-shade);
      --glass-blur: 0px;
      --glass-saturate: 100%;
      --glass-bg: var(--paper-sheet);
      --glass-bg-strong: var(--paper-sheet);
      --glass-edge: var(--paper-bevel-light);
      --glass-edge-outer: var(--paper-crease);
      --glass-highlight: rgba(255, 255, 255, 0.55);
      --glass-depth: rgba(120, 104, 76, 0.22);
      --glass-shade: rgba(120, 104, 76, 0.34);
      --glass-lens-scale: 0;
      --glass-lens-blur: 0;
      --glass-frost: 0;
      --glass-tint: rgba(255, 255, 255, 0.4);
      /*
       * The legacy glass shadow names map onto the paper layers, so every pane
       * that already asks for `--glass-shadow` gets a paper shadow without a
       * second class. `raised` is the lifted tier.
       */
      --glass-shadow: var(--paper-shadow-card);
      --glass-shadow-raised: var(--paper-shadow-lifted);
      /*
       * Pressed-in states, not lit-up states.
       *
       * On glass a hover adds light; on paper a control presses into the
       * sheet, so hover darkens slightly and the inner shadow moves to the top
       * lip. The fills stay opaque because the sheet is.
       */
      --glass-hover-fill: #f6f1e4;
      --glass-hover-rim: rgba(255, 255, 255, 0.75);
      --glass-hover-shade: rgba(120, 104, 76, 0.18);
      --glass-active-fill: #ece4d1;
      --glass-selected-fill: #e6edf3;
      --glass-selected-hover-fill: #dbe6ef;
      --glass-selected-rim: rgba(74, 103, 133, 0.5);
      --glass-input-fill: #fdfbf5;
      --glass-surface-float: var(--paper-sheet);
      --glass-surface-panel: var(--paper-sheet);
      --glass-surface-solid: var(--paper-sheet);

      /*
       * Handwriting, scoped.
       *
       * `Xiaolai` covers Chinese and `Virgil` the Latin glyphs — both already
       * ship inside the Excalidraw bundle, so this adds no download. Only
       * headings and the appearance switcher use it; board names, revision
       * numbers, and menu items stay in the UI font because a handwritten
       * 11px label is a legibility bug, not a style.
       */
      --doodle-font-sketch: "Doodle Sketch", "Segoe Print", "Bradley Hand", var(--doodle-font);
    }
    :root[data-doodle-theme="dark"] {
      color-scheme: dark;
      --doodle-surface: rgba(28, 36, 33, 0.92);
      --doodle-surface-solid: #161d1a;
      --doodle-panel: rgba(24, 32, 29, 0.97);
      --doodle-ink: #e6eee9;
      --doodle-muted: #94a49b;
      --doodle-border: rgba(230, 238, 233, 0.14);
      --doodle-border-strong: rgba(230, 238, 233, 0.24);
      --doodle-accent: #8fcbb4;
      --doodle-accent-soft: rgba(143, 203, 180, 0.14);
      --doodle-accent-ink: #0e221b;
      --doodle-danger: #e89288;
      --doodle-canvas-bg: #131a18;
      --doodle-dot: rgba(143, 203, 180, 0.24);
      --doodle-wash-a: rgba(232, 178, 60, 0.18);
      --doodle-wash-b: rgba(143, 203, 180, 0.24);
      --doodle-wash-c: rgba(120, 170, 205, 0.16);
      --doodle-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);

      --glass-bg: rgba(150, 180, 168, 0.07);
      --glass-bg-strong: rgba(28, 38, 34, 0.9);
      --glass-edge: rgba(255, 255, 255, 0.86);
      --glass-edge-outer: rgba(255, 255, 255, 0.3);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --glass-depth: rgba(0, 0, 0, 0.34);
      --glass-shade: rgba(0, 0, 0, 0.55);
      --glass-lens-scale: 0.9;
      --glass-lens-blur: 0.05;
      /* Centre frost radius: how soft the flat middle of the pane is. */
      --glass-frost: 0.42;
      --glass-tint: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 1px 2px rgba(0, 0, 0, 0.36), 0 14px 34px -8px rgba(0, 0, 0, 0.5);
      --glass-shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.4), 0 22px 52px -10px rgba(0, 0, 0, 0.6);
      --glass-hover-fill: rgba(255, 255, 255, 0.1);
      --glass-hover-rim: rgba(255, 255, 255, 0.22);
      --glass-hover-shade: rgba(0, 0, 0, 0.18);
      --glass-active-fill: rgba(255, 255, 255, 0.16);
      --glass-selected-fill: rgba(143, 203, 180, 0.16);
      --glass-selected-hover-fill: rgba(143, 203, 180, 0.24);
      --glass-selected-rim: rgba(143, 203, 180, 0.42);
      --glass-input-fill: rgba(255, 255, 255, 0.06);
    }
    .excalidraw {
      --color-primary: #2f6b5c;
      --color-primary-darker: #275a4e;
      --color-primary-darkest: #1f4a40;
      --color-primary-light: #dcebe4;
      --color-primary-light-darker: #cfe2d9;
      --color-primary-hover: #2a6154;
      --color-selection: #2f6b5c;
      --color-brand-hover: #275a4e;
      --color-brand-active: #1f4a40;
      --color-on-primary-container: #1f4a40;
      --color-surface-primary-container: #dcebe4;
      --color-surface-high: #eef2ea;
      --color-surface-mid: #f2f4ef;
      --color-surface-low: #e9ede5;
      --color-surface-lowest: #fbfcf8;
      --color-on-surface: #1e2a26;
      --color-border-outline: #6b7a72;
      --color-border-outline-variant: #c9d2cb;
      --island-bg-color: #fdfefb;
      --glass-surface-float: color-mix(in srgb, var(--island-bg-color) 7%, transparent);
      --glass-surface-panel: color-mix(in srgb, var(--island-bg-color) 22%, transparent);
      --glass-surface-solid: color-mix(in srgb, var(--island-bg-color) 46%, transparent);
      --button-gray-1: #eef2ea;
      --button-gray-2: #e2e8e0;
      --button-gray-3: #cfd7d1;
      --button-hover-bg: #eef2ea;
      --button-active-bg: #e2e8e0;
      --button-active-border: #2f6b5c;
      --focus-highlight-color: #2f6b5c;
      --link-color: #2f6b5c;
      --default-border-color: #e2e8e0;
      --input-bg-color: #fbfcf8;
      --input-border-color: #c9d2cb;
      --input-hover-bg-color: #eef2ea;
      --input-label-color: #526159;
      --popup-secondary-bg-color: #f2f4ef;
      --shadow-island: 0 1px 2px rgba(24, 40, 34, 0.08), 0 8px 24px rgba(24, 40, 34, 0.08);
    }
    /*
     * Doodle keeps Excalidraw on its light *theme* so board colours stay
     * literal, but the page has its own dark mode. Without this the chrome
     * tokens stay light while the page goes dark, so the zoom group, the help
     * button, and the library trigger rendered as white panes floating on a
     * black canvas. The selector matches both cases: upstream's own dark theme,
     * and Doodle's dark page with a light canvas theme.
     */
    .excalidraw.theme--dark,
    :root[data-doodle-theme="dark"] .excalidraw {
      --color-primary: #8fcbb4;
      --color-primary-darker: #a3d6c2;
      --color-primary-darkest: #bde4d3;
      --color-primary-light: #2c4a3f;
      --color-primary-light-darker: #355949;
      --color-primary-hover: #a3d6c2;
      --color-selection: #8fcbb4;
      --color-brand-hover: #a3d6c2;
      --color-brand-active: #bde4d3;
      --color-on-primary-container: #bfe6d6;
      --color-surface-primary-container: #2c4a3f;
      --color-surface-high: #263029;
      --color-surface-mid: #1b2320;
      --color-surface-low: #202925;
      --color-surface-lowest: #131a18;
      --color-on-surface: #e6eee9;
      --color-border-outline: #8a9a91;
      --color-border-outline-variant: #3a4743;
      --island-bg-color: #1c2421;
      --glass-surface-float: color-mix(in srgb, var(--island-bg-color) 10%, transparent);
      --glass-surface-panel: color-mix(in srgb, var(--island-bg-color) 26%, transparent);
      --glass-surface-solid: color-mix(in srgb, var(--island-bg-color) 52%, transparent);
      --button-gray-1: #2a342f;
      --button-gray-2: #333f39;
      --button-gray-3: #3c4a43;
      --button-hover-bg: #263029;
      --button-active-bg: #2c4a3f;
      --button-active-border: #8fcbb4;
      --focus-highlight-color: #8fcbb4;
      --link-color: #8fcbb4;
      --default-border-color: #333f39;
      --input-bg-color: #131a18;
      --input-border-color: #3a4743;
      --input-hover-bg-color: #202925;
      --input-label-color: #c4d0c9;
      --popup-secondary-bg-color: #202925;
      --scrollbar-thumb: #3a4743;

    /*

     */

    * { box-sizing: border-box; }

     * lit rim, blurs, and saturates. Where the engine cannot run an SVG

     * fallback keeps the plain blur, so the material degrades to frosted glass
     * instead of turning into an opaque box.

     * light lands, a soft dark inner bottom where the glass thickens, a
     * hairline inner ring, and a wide drop shadow. `::before` adds the

       * produce that, because blur preserves mean brightness.

       * comes from the specular map in `liquid-glass.ts`, which follows the rim
       * exactly, so the shadow stays limited to hairline edges.

     * them across most of a 44px pill, which turned the glass back into a

     * than the UI sans they replace.
     */
    :root[data-doodle-theme="sketch"] .doodle-library-head strong,
    :root[data-doodle-theme="sketch"] .doodle-welcome h2,
    :root[data-doodle-theme="sketch"] .doodle-library-section > strong,
    :root[data-doodle-theme="sketch"] .doodle-theme-option {
      font-family: var(--doodle-font-sketch);
      letter-spacing: 0.03em;
    }
    :root[data-doodle-theme="sketch"] .doodle-library-head strong,
    :root[data-doodle-theme="sketch"] .doodle-welcome h2 {
      font-size: 15px;
      font-weight: 600;
    }
    /*
     * Paper is thinner than glass, so the panes float less. The rim stays legible
     * because the surface token above is denser than in the glass themes.
     */
    :root[data-doodle-theme="sketch"] .doodle-glass::after { opacity: 0.5; }
    :root[data-doodle-theme="sketch"] .doodle-glass::before { opacity: 0.22; }
    /*
     * Physical paper material.
     *
     * `data-doodle-material="paper"` is set by the app when the appearance is
     * sketch, so these rules key off a material switch rather than repeating
     * the theme selector everywhere. The three parts:
     *
     *   thickness  a darker lip under the bottom edge, from `box-shadow`, so the
     *              card has a visible side like a piece of card stock;
     *   bevel      a bright 1px top edge where the paper catches light, plus a
     *              hairline ring so the sheet boundary is crisp on a warm ground;
     *   contact    a short, fairly dark shadow. Glass floats; paper rests.
     *
     * The `::before` sheen is repurposed as a paper grain wash rather than a
     * specular highlight, and `::after` supplies the top bevel.
     */
    /*
     * Paper fibre, generated rather than shipped.
     *
     * Two fields at different scales: a low-frequency one gives visible fibres
     * the way card stock has a grain direction, a high-frequency one supplies
     * tooth at reading distance. A single field reads as noise; the pair reads
     * as stock. Both are `feTurbulence` desaturated to alpha only, so the sheet
     * colour shows through and the texture is colourless by construction.
     *
     * The alpha is deliberately tiny (0.07 / 0.05). At 4x the fibre is clearly
     * visible; at 1x it registers as "not a flat fill" rather than as a pattern.
     */
    :root[data-doodle-material="paper"] {
      /*
       * A single isotropic frequency pair.
       *
       * An earlier attempt used `0.06 0.9`, intending "long fibres along x".
       * At 6x that read as wood grain: paper has no direction, and any
       * anisotropic field looks like a machined surface instead. The field is
       * therefore isotropic and sits low — fine enough to be tooth, coarse
       * enough that it survives the DPR downsample to a 1x screen.
       */
      --paper-fibre: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='f' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.62' numOctaves='3' seed='19'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0.11'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23f)'/%3E%3C/svg%3E");
      --paper-tooth: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='96' height='96'%3E%3Cfilter id='t' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='3' seed='7'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0.05'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='96' height='96' filter='url(%23t)'/%3E%3C/svg%3E");
    }
    /*
     * A sheet of card.
     *
     * Four things make it read as stock rather than as a rounded rectangle:
     *
     *   fibre     two generated noise fields, multiplied so they darken the
     *             sheet rather than washing it out;
     *   cut edge  a 1px hairline in the stock's own crease colour. Paper edges
     *             are not a drawn border, but at 1x they read the same, and a
     *             hairline keeps the corner radius crisp;
     *   bevel     a bright inner line on the top and left (facing the light) and
     *             a warmer shade on the bottom and right. Both are inner
     *             shadows, so they cannot change the layout box;
     *   thickness a two-step lip under the bottom edge — the sheet edge, then
     *             the shadow of the sheet edge. That pair is what gives the card
     *             a visible side at 44px tall without a 3D transform.
     */
    :root[data-doodle-material="paper"] .doodle-glass {
      background-color: var(--paper-sheet);
      background-image: var(--paper-fibre), var(--paper-tooth);
      background-size: 200px 200px, 96px 96px;
      background-blend-mode: multiply, multiply;
      border: 1px solid var(--paper-crease);
      box-shadow:
        inset 1px 1px 0 0 var(--paper-bevel-light),
        inset -1px -1px 0 0 var(--paper-sheet-warm),
        inset 0 -2px 0 0 var(--paper-sheet-edge),
        inset 0 -3px 0 0 var(--paper-lip),
        var(--paper-shadow-card);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    /*
     * The sheet has no sheen; paper does not reflect.
     *
     * The glass themes use `::before` for a specular highlight. Here it is
     * repurposed as a single, very wide, very soft light gradient from the
     * upper left — the same light direction as the bevel, so the sheet reads as
     * one flat plane catching ambient light rather than as a glossy surface.
     * Opacity stays under 0.35: above that it starts to look like a gradient
     * fill and the fibre disappears under it.
     */
    :root[data-doodle-material="paper"] .doodle-glass::before {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(255, 255, 255, 0.08) 38%,
        rgba(120, 104, 76, 0.03) 100%
      );
      opacity: 1;
      mix-blend-mode: soft-light;
    }
    /*
     * Cut edge.
     *
     * `::after` stops being a sheen and becomes the paper's edge: a hairline of
     * light on the top inside, a hairline of shade on the bottom inside, and
     * nothing in between. Two thin lines at the rim are what separate "a
     * printed rectangle" from "a piece of stock" at 44px tall.
     */
    :root[data-doodle-material="paper"] .doodle-glass::after {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.55) 0 1px,
        transparent 1px,
        transparent calc(100% - 1px),
        rgba(120, 104, 76, 0.09) calc(100% - 1px)
      );
      opacity: 1;
      mix-blend-mode: normal;
    }
    /*
     * Native Excalidraw islands become paper cards too. They are separate from
     * `.doodle-glass`, so the material has to be stated again; the inner button
     * fills are re-declared below because the paper sheet is opaque and needs a
     * visible pressed state instead of a translucent wash.
     */
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar,
    :root[data-doodle-material="paper"] .excalidraw .App-menu_bottom .Island,
    :root[data-doodle-material="paper"] .excalidraw .layer-ui__wrapper__top-right .Island,
    :root[data-doodle-material="paper"] .excalidraw .zoom-actions,
    :root[data-doodle-material="paper"] .excalidraw .undo-redo-buttons,
    :root[data-doodle-material="paper"] .excalidraw .help-icon,
    :root[data-doodle-material="paper"] .excalidraw .sidebar-trigger,
    :root[data-doodle-material="paper"] .excalidraw .default-sidebar-trigger,
    :root[data-doodle-material="paper"] .excalidraw .mobile-misc-tools-container,
    :root[data-doodle-material="paper"] .excalidraw .App-bottom-bar > .Island {
      background-color: var(--paper-sheet) !important;
      background-image: var(--paper-fibre), var(--paper-tooth);
      background-size: 200px 200px, 96px 96px;
      background-blend-mode: multiply, multiply;
      border: 1px solid var(--paper-crease);
      box-shadow:
        inset 1px 1px 0 0 var(--paper-bevel-light),
        inset -1px -1px 0 0 var(--paper-sheet-warm),
        inset 0 -2px 0 0 var(--paper-lip),
        var(--paper-shadow-card) !important;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    /* Menus are lifted sheets, so they get the deeper contact shadow. */
    :root[data-doodle-material="paper"] .excalidraw .dropdown-menu .dropdown-menu-container,
    :root[data-doodle-material="paper"] .excalidraw .dropdown-menu--mobile .dropdown-menu-container {
      background-color: var(--paper-sheet) !important;
      background-image: var(--paper-fibre), var(--paper-tooth);
      background-size: 200px 200px, 96px 96px;
      background-blend-mode: multiply, multiply;
      border: 1px solid var(--paper-crease);
      box-shadow:
        inset 1px 1px 0 0 var(--paper-bevel-light),
        inset -1px -1px 0 0 var(--paper-sheet-warm),
        inset 0 -2px 0 0 var(--paper-lip),
        var(--paper-shadow-lifted) !important;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    /*
     * The drawer is the one surface held above the desk, so it takes the lifted
     * shadow while everything else rests. That height difference is most of what
     * makes a physical layout read as layered instead of flat.
     */
    :root[data-doodle-material="paper"] .doodle-library-panel {
      background-color: var(--paper-sheet);
      background-image: var(--paper-fibre), var(--paper-tooth);
      background-size: 200px 200px, 96px 96px;
      background-blend-mode: multiply, multiply;
      border: 1px solid var(--paper-crease);
      box-shadow:
        inset 1px 1px 0 0 var(--paper-bevel-light),
        inset -1px -1px 0 0 var(--paper-sheet-warm),
        inset 0 -2px 0 0 var(--paper-lip),
        var(--paper-shadow-lifted);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    /*
     * Controls printed on the sheet, not cards stacked on it.
     *
     * Rows, buttons, and the name field were inheriting `--doodle-surface-solid`,
     * which is near-white — on a cream sheet that reads as a second, brighter
     * layer. They become slightly *darker* than the sheet instead, like ink
     * printed on stock, and take the same hairline edge as the pane so the
     * group stays coherent.
     */
    :root[data-doodle-material="paper"] .doodle-library-name,
    :root[data-doodle-material="paper"] .doodle-library-entry,
    :root[data-doodle-material="paper"] .doodle-library-rename button,
    :root[data-doodle-material="paper"] .doodle-library-sectionhead-actions button,
    :root[data-doodle-material="paper"] .doodle-library-footer button,
    :root[data-doodle-material="paper"] .doodle-library-shares button,
    :root[data-doodle-material="paper"] .doodle-tool {
      background-color: transparent;
      border-color: var(--paper-crease);
      box-shadow: none;
    }
    :root[data-doodle-material="paper"] .doodle-library-entry.active {
      background-color: rgba(74, 103, 133, 0.09);
      box-shadow: inset 0 0 0 1px var(--glass-selected-rim);
    }
    /*
     * Tool buttons press into the sheet.
     *
     * On glass, hover adds a translucent wash. On opaque paper a wash has
     * nothing to show through, so the control changes colour like a printed
     * key and gains an inner top shadow — the recessed look of a physical
     * button. Geometry never changes.
     */
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar .ToolIcon__icon:hover:not([aria-disabled="true"]),
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar .ToolIcon:hover .ToolIcon__icon:not([aria-disabled="true"]),
    :root[data-doodle-material="paper"] .excalidraw .zoom-actions .zoom-button:hover .ToolIcon__icon,
    :root[data-doodle-material="paper"] .excalidraw .undo-redo-buttons button:hover .ToolIcon__icon {
      background: var(--glass-hover-fill) !important;
      box-shadow:
        inset 0 1px 2px 0 var(--glass-hover-shade),
        inset 0 -1px 0 0 var(--glass-hover-rim);
    }
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar .ToolIcon__icon:active:not([aria-disabled="true"]),
    :root[data-doodle-material="paper"] .excalidraw .zoom-actions .zoom-button:active .ToolIcon__icon,
    :root[data-doodle-material="paper"] .excalidraw .undo-redo-buttons button:active .ToolIcon__icon {
      background: var(--glass-active-fill) !important;
      box-shadow:
        inset 0 2px 3px 0 var(--glass-hover-shade),
        inset 0 -1px 0 0 var(--glass-hover-rim);
    }
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar .ToolIcon .ToolIcon_type_radio:checked + .ToolIcon__icon,
    :root[data-doodle-material="paper"] .excalidraw .App-toolbar .ToolIcon--selected .ToolIcon__icon {
      background: var(--glass-selected-fill) !important;
      box-shadow:
        inset 0 1px 0 0 var(--glass-hover-rim),
        inset 0 0 0 1px var(--glass-selected-rim),
        inset 0 -1px 0 0 var(--glass-hover-shade);
    }
    /* Doodle's own capsule buttons keep their pressed states on paper too. */
    :root[data-doodle-material="paper"] .doodle-tool:hover {
      background: var(--glass-hover-fill);
      border-color: var(--paper-crease);
    }
    :root[data-doodle-material="paper"] .doodle-theme-option[aria-pressed="true"] {
      background: var(--glass-selected-fill);
      box-shadow: inset 0 1px 2px 0 var(--glass-hover-shade);
    }
    .doodle-welcome p { margin: 0; color: var(--doodle-muted); font-size: 12px; line-height: 1.6; }
    .doodle-welcome dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 2px 0 0; font-size: 12px; }
    .doodle-welcome dt { color: var(--doodle-ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .doodle-welcome dd { margin: 0; color: var(--doodle-muted); }
    .doodle-welcome-actions { display: flex; justify-content: flex-end; margin-top: 2px; }
    .doodle-welcome-actions button { min-height: 30px; padding: 0 14px; border: 1px solid transparent; border-radius: 9px; background: var(--doodle-accent); color: var(--doodle-accent-ink); cursor: pointer; font-size: 12px; }
    .doodle-welcome-actions button:hover { filter: brightness(1.05); }
    @keyframes doodle-welcome-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @media (max-height: 620px) { .doodle-welcome { bottom: 96px; padding: 12px 14px; } .doodle-welcome dl { display: none; } }
    @media (max-width: 640px) {
      /*
       * Narrow screens keep the capsule under the toolbar, but Excalidraw's
       * first-use hint sits on the same line and used to show through it. The
       * hint is decorative: the Doodle welcome card carries the same guidance
       * in the board's own voice.
       */
      .doodle-topbar { top: 64px; left: 12px; }
      /*
       * On a phone the drawer is the whole surface, so it must not start under
       * the toolbar: the capsule sits at 64px, and 12px insets leave a rounded
       * card that still shows the canvas edge behind it.
       */
      .doodle-library-panel { top: 12px; left: 8px; right: 8px; bottom: 8px; width: auto; border-radius: 16px; }
      .doodle-notify-agent { right: 8px; bottom: 8px; }
    }
    @media (max-height: 620px) {
      .doodle-library-panel { gap: 6px; padding: 12px; }
      .doodle-library-section { padding-top: 8px; }
      .doodle-library-list { min-height: 64px; }
    }
    @media (prefers-reduced-motion: reduce) { .doodle-tool, .doodle-notify-agent, .doodle-library-panel, .doodle-library-entry, .doodle-library-sectionhead-actions button, .doodle-library-footer button, .doodle-library-shares button { transition: none !important; } }
  </style>
</head>
<body>
  <div id="excalidrawRoot"></div>
  <div class="doodle-topbar doodle-glass" role="toolbar" aria-label="Doodle 画板控制">
    <button class="doodle-tool" id="doodleLibraryToggle" aria-expanded="false" aria-controls="doodleLibraryPanel">图库</button>
    <!--
      Appearance switcher.

      A three-way choice cannot live behind a single toggle: with more than two
      appearances the icon no longer tells you which one you will land on, and
      cycling forces a person through themes they did not want. Three explicit
      options show what is available and which one is active.
    -->
    <div class="doodle-themes" id="doodleThemeToggle" role="group" aria-label="外观">
      <button class="doodle-theme-option" data-theme-option="light" aria-pressed="true" title="浅色 · 暖纸与松绿">浅</button>
      <button class="doodle-theme-option" data-theme-option="dark" aria-pressed="false" title="深色 · 墨绿与夜色">深</button>
      <button class="doodle-theme-option" data-theme-option="sketch" aria-pressed="false" title="手绘 · 纸面与铅笔">绘</button>
    </div>
  </div>
  <button class="doodle-notify-agent doodle-glass" id="doodleNotifyAgent" hidden>通知 Agent</button>
  <section class="doodle-welcome doodle-glass" id="doodleWelcome" hidden aria-label="开始使用画板">
    <h2>这是一张空画板</h2>
    <p>不用配置，直接开始画。和 AI 一起用时，它会读写同一张画板。</p>
    <dl>
      <dt>双击空白</dt><dd>新建一张便签</dd>
      <dt>拖拽</dt><dd>画形状、箭头或手写</dd>
      <dt>空格 / 滚轮</dt><dd>平移画板</dd>
      <dt>⌘ / Ctrl + 滚轮</dt><dd>缩放</dd>
    </dl>
    <div class="doodle-welcome-actions"><button id="doodleWelcomeDismiss" type="button">开始画</button></div>
  </section>
  <div class="doodle-drawer-scrim" id="doodleDrawerScrim" hidden></div>
  <section class="doodle-library-panel" id="doodleLibraryPanel" hidden aria-label="画板图库">
    <div class="doodle-library-head"><strong>画板图库</strong><button id="doodleLibraryClose" aria-label="关闭图库">×</button></div>
    <div id="doodleLibraryCurrent" class="doodle-library-kicker">当前：—</div>
    <div id="doodleLibraryStatus" class="doodle-library-kicker" role="status" aria-live="polite"></div>
    <!--
      One name field, and the actions that consume it sit on the same row.

      The panel used to carry six equal buttons plus two more below the list,
      all on the same grid: "另存为" and "复制所选" were the same operation under
      two labels, and "重命名" read from the field above while looking like a
      sibling of "新建". Grouping by what a person is trying to do — name this
      board, pick a board, share it — removes the guessing.
    -->
    <div class="doodle-library-rename">
      <input class="doodle-library-name" id="doodleLibraryName" maxlength="80" placeholder="画板名称">
      <button id="doodleLibraryRename" title="保存为新名称">重命名</button>
    </div>
    <div class="doodle-library-section doodle-library-section--boards">
      <div class="doodle-library-sectionhead"><strong>全部画板</strong>
        <div class="doodle-library-sectionhead-actions">
          <button id="doodleLibraryImport">导入</button>
          <button data-library-action="create">新建</button>
          <button data-library-action="duplicate">另存一份</button>
        </div>
      </div>
      <div class="doodle-library-list" id="doodleLibraryList"></div>
    </div>
    <div class="doodle-library-section doodle-library-section--shares"><strong>分享快照</strong><div class="doodle-library-shares" aria-label="分享快照格式">
      <button data-snapshot-export="png">导出 PNG</button>
      <button data-snapshot-export="jpg">导出 JPG</button>
      <button data-snapshot-export="svg">导出 SVG</button>
    </div></div>
    <input type="file" id="doodleLibraryFile" accept="application/json,.json" hidden>
  </section>
  <script>const PANEL_TOKEN = "__DOODLE_PANEL_TOKEN__"; window.DOODLE_EXCALIDRAW_TOKEN = PANEL_TOKEN;</script>
  <script>window.DOODLE_MCP_APP_EMBEDDED = "__DOODLE_MCP_APP__" === "1";</script>
  <script type="module" src="/excalidraw/excalidraw-app.js?v=__DOODLE_ASSET_VERSION__"></script>
</body>
</html>
