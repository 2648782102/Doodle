<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle · Excalidraw Canvas</title>
  <style>
    :root {
      color-scheme: light;
      --doodle-surface: rgba(255, 255, 255, 0.92);
      --doodle-surface-solid: #ffffff;
      --doodle-panel: rgba(250, 251, 253, 0.96);
      --doodle-ink: #172033;
      --doodle-muted: #637083;
      --doodle-border: rgba(23, 32, 51, 0.12);
      --doodle-border-strong: rgba(23, 32, 51, 0.2);
      --doodle-accent: #2f6f62;
      --doodle-accent-soft: rgba(47, 111, 98, 0.11);
      --doodle-accent-ink: #ffffff;
      --doodle-danger: #b4463d;
      --doodle-canvas-bg: #f7f8f5;
      --doodle-dot: rgba(47, 111, 98, 0.18);
      --doodle-shadow: 0 16px 44px rgba(28, 40, 56, 0.14);
      --doodle-radius: 12px;
      --doodle-radius-sm: 8px;
      --doodle-space: 8px;
      --doodle-font: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    :root[data-doodle-theme="dark"] {
      color-scheme: dark;
      --doodle-surface: rgba(27, 33, 43, 0.92);
      --doodle-surface-solid: #171d27;
      --doodle-panel: rgba(22, 28, 37, 0.96);
      --doodle-ink: #ecf2f1;
      --doodle-muted: #9aa7ad;
      --doodle-border: rgba(236, 242, 241, 0.14);
      --doodle-border-strong: rgba(236, 242, 241, 0.25);
      --doodle-accent: #86c6ae;
      --doodle-accent-soft: rgba(134, 198, 174, 0.14);
      --doodle-accent-ink: #10221d;
      --doodle-danger: #e89288;
      --doodle-canvas-bg: #151b23;
      --doodle-dot: rgba(134, 198, 174, 0.22);
      --doodle-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body, #excalidrawRoot { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--doodle-surface-solid); color: var(--doodle-ink); font-family: var(--doodle-font); }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--doodle-accent); outline-offset: 2px; }
    .excalidraw-host { height: 100%; position: relative; background-color: var(--doodle-canvas-bg); background-image: radial-gradient(circle, var(--doodle-dot) 1px, transparent 1px); background-size: 20px 20px; background-position: 10px 10px; }
    .excalidraw-host > .excalidraw { position: relative; background: transparent; }
    .excalidraw .App-menu_top { z-index: 4; }
    .excalidraw .App-menu_top .App-toolbar, .excalidraw .App-menu_bottom, .excalidraw .layer-ui__wrapper__top-right { filter: saturate(0.86); }
    .doodle-topbar { position: fixed; top: 14px; right: 14px; z-index: 20; display: flex; gap: 6px; align-items: center; padding: 4px; border: 1px solid var(--doodle-border); border-radius: 14px; background: var(--doodle-surface); box-shadow: var(--doodle-shadow); backdrop-filter: blur(12px); }
    .doodle-tool { min-height: 30px; padding: 0 11px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--doodle-muted); cursor: pointer; font-size: 12px; letter-spacing: 0.01em; }
    .doodle-tool:hover { border-color: var(--doodle-border); color: var(--doodle-ink); background: var(--doodle-accent-soft); }
    .doodle-tool[aria-expanded="true"] { color: var(--doodle-ink); background: var(--doodle-accent-soft); }
    .doodle-tool-primary { background: var(--doodle-accent); color: var(--doodle-accent-ink); border-color: transparent; }
    .doodle-tool-primary:hover { color: var(--doodle-accent-ink); filter: brightness(1.05); }
    .doodle-tool-icon { width: 30px; padding: 0; font-size: 14px; }
    .doodle-notify-agent { position: fixed; right: 14px; bottom: 14px; z-index: 20; height: 36px; padding: 0 14px; border: 1px solid transparent; border-radius: 18px; background: var(--doodle-accent); color: var(--doodle-accent-ink); cursor: pointer; font-size: 12px; box-shadow: var(--doodle-shadow); }
    .doodle-notify-agent:hover { filter: brightness(1.05); }
    .doodle-notify-agent[hidden] { display: none; }
    .doodle-library-panel { position: fixed; top: 58px; right: 14px; z-index: 20; width: min(320px, calc(100vw - 28px)); max-height: calc(100% - 76px); overflow: auto; padding: 16px; border: 1px solid var(--doodle-border); border-radius: var(--doodle-radius); background: var(--doodle-panel); box-shadow: var(--doodle-shadow); backdrop-filter: blur(16px); }
    .doodle-library-panel[hidden] { display: none; }
    .doodle-library-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .doodle-library-head strong { font-size: 14px; font-weight: 650; letter-spacing: 0.01em; }
    .doodle-library-head button { margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--doodle-muted); cursor: pointer; }
    .doodle-library-head button:hover { background: var(--doodle-accent-soft); color: var(--doodle-ink); }
    .doodle-library-kicker { color: var(--doodle-muted); font-size: 11px; line-height: 1.5; }
    .doodle-library-name { width: 100%; height: 34px; margin-top: 10px; padding: 0 10px; border: 1px solid var(--doodle-border); border-radius: var(--doodle-radius-sm); background: var(--doodle-surface-solid); color: var(--doodle-ink); }
    .doodle-library-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--doodle-border); }
    .doodle-library-section > strong { display: block; margin-bottom: 8px; color: var(--doodle-muted); font-size: 11px; font-weight: 600; }
    .doodle-library-actions, .doodle-library-footer, .doodle-library-shares { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .doodle-library-footer { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
    .doodle-library-actions button, .doodle-library-footer button, .doodle-library-shares button { min-height: 32px; padding: 0 7px; border: 1px solid var(--doodle-border); border-radius: var(--doodle-radius-sm); background: var(--doodle-surface-solid); color: var(--doodle-ink); cursor: pointer; font-size: 11px; }
    .doodle-library-actions button:hover, .doodle-library-footer button:hover, .doodle-library-shares button:hover { border-color: var(--doodle-accent); background: var(--doodle-accent-soft); }
    .doodle-library-actions button[data-library-action="delete"] { color: var(--doodle-danger); }
    .doodle-library-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; }
    .doodle-library-entry { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--doodle-border); border-radius: 9px; background: var(--doodle-surface-solid); }
    .doodle-library-entry.active { border-color: var(--doodle-accent); background: var(--doodle-accent-soft); }
    .doodle-library-entry button { border: 0; background: transparent; color: var(--doodle-ink); text-align: left; cursor: pointer; padding: 0; font-size: 12px; }
    .doodle-library-entry small { display: block; color: var(--doodle-muted); font-size: 10px; margin-top: 2px; }
    @media (max-width: 640px) {
      .doodle-topbar { top: 8px; right: 8px; }
      .doodle-library-panel { top: 52px; right: 8px; width: calc(100vw - 16px); }
      .doodle-notify-agent { right: 8px; bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { .doodle-tool, .doodle-notify-agent, .doodle-library-panel { transition: none; } }
  </style>
  <link rel="stylesheet" href="/excalidraw/index.css">
</head>
<body>
  <div id="excalidrawRoot"></div>
  <div class="doodle-topbar" role="toolbar" aria-label="Doodle 画板控制">
    <button class="doodle-tool" id="doodleLibraryToggle" aria-expanded="false" aria-controls="doodleLibraryPanel">图库</button>
    <button class="doodle-tool doodle-tool-icon" id="doodleThemeToggle" aria-label="切换深色主题" title="切换明暗主题">◐</button>
  </div>
  <button class="doodle-notify-agent" id="doodleNotifyAgent" hidden>通知 Agent</button>
  <section class="doodle-library-panel" id="doodleLibraryPanel" hidden aria-label="画板图库">
    <div class="doodle-library-head"><strong>画板图库</strong><button id="doodleLibraryClose" aria-label="关闭图库">×</button></div>
    <div id="doodleLibraryCurrent" class="doodle-library-kicker">当前：—</div>
    <div id="doodleLibraryStatus" class="doodle-library-kicker" role="status" aria-live="polite"></div>
    <input class="doodle-library-name" id="doodleLibraryName" maxlength="80" placeholder="画板名称">
    <div class="doodle-library-section"><strong>画板</strong><div class="doodle-library-actions">
      <button data-library-action="duplicate">另存为</button>
      <button data-library-action="create">新建</button>
      <button data-library-action="rename">重命名</button>
      <button data-library-action="duplicate-selected">复制所选</button>
      <button data-library-action="export">导出 JSON</button>
      <button data-library-action="delete">删除</button>
    </div><div class="doodle-library-list" id="doodleLibraryList"></div><div class="doodle-library-footer">
      <button id="doodleLibraryImport">导入 JSON</button>
      <button id="doodleLibrarySwitch">切换到选中</button>
    </div></div>
    <div class="doodle-library-section"><strong>分享快照</strong><div class="doodle-library-shares" aria-label="分享快照格式">
      <button data-snapshot-export="png">导出 PNG</button>
      <button data-snapshot-export="jpg">导出 JPG</button>
      <button data-snapshot-export="svg">导出 SVG</button>
    </div></div>
    <input type="file" id="doodleLibraryFile" accept="application/json,.json" hidden>
  </section>
  <script>const PANEL_TOKEN = "__DOODLE_PANEL_TOKEN__"; window.DOODLE_EXCALIDRAW_TOKEN = PANEL_TOKEN;</script>
  <script>window.DOODLE_MCP_APP_EMBEDDED = "__DOODLE_MCP_APP__" === "1";</script>
  <script type="module" src="/excalidraw/excalidraw-app.js?v=__DOODLE_ASSET_VERSION__"></script>
</body>
</html>
