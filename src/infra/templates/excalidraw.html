<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle · Excalidraw Canvas</title>
  <style>
    html, body, #excalidrawRoot { height: 100%; margin: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .excalidraw-host { height: 100%; }
    .excalidraw .App-menu_top { z-index: 4; }
    .doodle-library-toggle { position: fixed; top: 14px; right: 140px; z-index: 20; height: 30px; padding: 0 10px; border: 1px solid #d9dde4; border-radius: 15px; background: rgba(255,255,255,.96); color: #6b7280; cursor: pointer; font-size: 12px; }
    .doodle-library-toggle:hover { color: #2563eb; }
    .doodle-notify-agent { position: fixed; right: 14px; bottom: 14px; z-index: 20; height: 34px; padding: 0 13px; border: 1px solid #2563eb; border-radius: 17px; background: #2563eb; color: #fff; cursor: pointer; font-size: 12px; box-shadow: 0 6px 18px rgba(37,99,235,.22); }
    .doodle-notify-agent:hover { background: #1d4ed8; }
    .doodle-notify-agent[hidden] { display: none; }
    .doodle-library-panel { position: fixed; top: 50px; right: 12px; z-index: 20; width: min(300px, calc(100vw - 24px)); max-height: calc(100% - 64px); overflow: auto; padding: 12px; border: 1px solid #d9dde4; border-radius: 12px; background: #fff; box-shadow: 0 12px 30px rgba(15,23,42,.12); }
    .doodle-library-panel[hidden] { display: none; }
    .doodle-library-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .doodle-library-head strong { font-size: 13px; }
    .doodle-library-head button { margin-left: auto; border: 0; background: transparent; color: #6b7280; cursor: pointer; }
    .doodle-library-name { width: 100%; height: 32px; padding: 0 9px; border: 1px solid #d9dde4; border-radius: 7px; }
    .doodle-library-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin: 8px 0 10px; }
    .doodle-library-actions button, .doodle-library-footer button { height: 30px; padding: 0 7px; border: 1px solid #d9dde4; border-radius: 7px; background: #fff; cursor: pointer; font-size: 11px; }
    .doodle-library-list { display: grid; gap: 5px; max-height: 240px; overflow: auto; }
    .doodle-library-entry { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 7px 8px; border: 1px solid #d9dde4; border-radius: 8px; }
    .doodle-library-entry.active { border-color: #2563eb; background: #eaf1ff; }
    .doodle-library-entry button { border: 0; background: transparent; text-align: left; cursor: pointer; padding: 0; }
    .doodle-library-entry small { display: block; color: #6b7280; font-size: 10px; margin-top: 2px; }
    .doodle-library-footer { display: flex; gap: 6px; margin-top: 10px; }
    .doodle-library-footer button { flex: 1; }
  </style>
  <link rel="stylesheet" href="/excalidraw/index.css">
</head>
<body>
  <div id="excalidrawRoot"></div>
  <button class="doodle-library-toggle" id="doodleLibraryToggle">图库</button>
  <button class="doodle-notify-agent" id="doodleNotifyAgent" hidden>通知 Agent</button>
  <section class="doodle-library-panel" id="doodleLibraryPanel" hidden aria-label="画板图库">
    <div class="doodle-library-head"><strong>画板图库</strong><button id="doodleLibraryClose">×</button></div>
    <div id="doodleLibraryCurrent" style="margin-bottom:8px;color:#6b7280;font-size:11px">当前：—</div>
    <input class="doodle-library-name" id="doodleLibraryName" maxlength="80" placeholder="画板名称">
    <div class="doodle-library-actions">
      <button data-library-action="save">另存为</button>
      <button data-library-action="create">新建</button>
      <button data-library-action="rename">重命名</button>
      <button data-library-action="duplicate">复制</button>
      <button data-library-action="export">导出 JSON</button>
      <button data-library-action="delete">删除</button>
    </div>
    <div class="doodle-library-list" id="doodleLibraryList"></div>
    <div class="doodle-library-footer">
      <button id="doodleLibraryImport">导入 JSON</button>
      <button id="doodleLibrarySwitch">切换到选中</button>
    </div>
    <input type="file" id="doodleLibraryFile" accept="application/json,.json" hidden>
  </section>
  <script>const PANEL_TOKEN = "__DOODLE_PANEL_TOKEN__"; window.DOODLE_EXCALIDRAW_TOKEN = PANEL_TOKEN;</script>
  <script>window.DOODLE_MCP_APP_EMBEDDED = "__DOODLE_MCP_APP__" === "1";</script>
  <script type="module" src="/excalidraw/excalidraw-app.js?v=__DOODLE_ASSET_VERSION__"></script>
</body>
</html>
